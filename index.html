  root.ShaharCore = api;
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  const seed = {

        frequency: 1,

      },
    ],
    sessions: [
      { id: "s1", clientId: "c1", date: "2026-11-02", time: "08:00", status: "completed", charge: true, title: "אימון אישי" },
      { id: "s2", clientId: "c1", date: "2026-11-05", time: "18:00", status: "confirmed", charge: false, title: "אימון אישי" },
      { id: "s3", clientId: "c1", date: "2026-11-09", time: "08:00", status: "planned", charge: false, title: "אימון אישי" },
      { id: "s4", clientId: "c2", date: "2026-11-03", time: "19:00", status: "awaiting", charge: false, title: "אימון אישי" },
      { id: "s5", clientId: "c2", date: "2026-10-27", time: "19:00", status: "late_cancel", charge: true, title: "אימון אישי" },
      { id: "s6", clientId: "c2", date: "2026-10-20", time: "19:00", status: "completed", charge: true, title: "אימון אישי" },
      { id: "s7", clientId: "c3", date: "2026-11-06", time: "10:00", status: "planned", charge: false, title: "אימון הדרכה" },
    ],
    alerts: [
      { id: "a1", type: "week", text: "שבוע חדש — לדנה וליעל עדיין אין אישור סופי", done: false },
      { id: "a2", type: "payment", text: "לדנה נותר חוב של 350 ₪", done: false },
      { id: "a3", type: "payment", text: "יעל טרם שילמה 480 ₪", done: false },
      { id: "a4", type: "medical", text: "יעל טרם השלימה את הטופס הרפואי", done: false },
      { id: "a5", type: "program", text: "התוכנית של דנה לא עודכנה יותר מחודש", done: false },
    ],
    feedbacks: [
      { id: "f1", sessionId: "s1", clientId: "c1", sendDate: "2026-11-03", status: "scheduled", sentVia: "WhatsApp", answers: null },
      { id: "f2", sessionId: "s6", clientId: "c2", sendDate: "2026-10-21", status: "answered", sentVia: "WhatsApp", answers: { workout: 4, difficulty: 4, body: 3 } },
    ],
    activity: [
      { time: "היום, 09:12", text: "האימון של מיה סומן כבוצע" },
      { time: "שישי, 13:40", text: "מיה אישרה את האימון ביום חמישי" },
      { time: "27.10", text: "הביטול של דנה סומן כמחויב" },
    ],
  };

  const statuses = {
    planned: { label: "מתוכנן", tone: "neutral" },
    awaiting: { label: "ממתין לאישור", tone: "warn" },
    confirmed: { label: "מאושר", tone: "info" },
    completed: { label: "בוצע", tone: "success" },
    late_cancel: { label: "ביטול מחויב", tone: "danger" },
    no_show: { label: "לא הגיע — מחויב", tone: "danger" },
    cancelled_free: { label: "בוטל ללא חיוב", tone: "muted" },
  };

  function createState() {
    return JSON.parse(JSON.stringify(seed));
  }
  function getClient(state, id) {
    return state.clients.find((c) => c.id === id);
  }
  function getSession(state, id) {
    return state.sessions.find((s) => s.id === id);
  }
  function debt(client) {
    return Math.max(0, client.packagePrice - client.paid);
  }
  function chargedSessions(state, clientId) {
    return state.sessions.filter((s) => s.clientId === clientId && s.charge).length;
  }
  function remainingSessions(state, clientId) {
    const client = getClient(state, clientId);
    if (!client) return 0;
    return Math.max(0, client.packageSize - chargedSessions(state, clientId));
  }
  function totals(state) {
    return {
      clients: state.clients.length,
      weekSessions: state.sessions.filter((s) => s.date >= "2026-11-02" && s.date <= "2026-11-08").length,
      awaiting: state.sessions.filter((s) => s.status === "awaiting" || s.status === "planned").length,
      debt: state.clients.reduce((sum, c) => sum + debt(c), 0),
      collected: state.clients.reduce((sum, c) => sum + c.paid, 0),
      alerts: state.alerts.filter((a) => !a.done).length,
      feedbackPending: state.feedbacks.filter((f) => f.status !== "answered").length,
    };
  }
  function setSessionStatus(state, sessionId, status) {
    const session = getSession(state, sessionId);
    if (!session || !statuses[status]) return { ok: false, message: "האימון לא נמצא" };
    session.status = status;
    session.charge = ["completed", "late_cancel", "no_show"].includes(status);
    const client = getClient(state, session.clientId);
    if (status === "completed") scheduleFeedback(state, sessionId);
    state.activity.unshift({ time: "עכשיו", text: `${client.name}: ${statuses[status].label}` });
    return { ok: true, session, client };
  }
  function scheduleFeedback(state, sessionId) {
    const session = getSession(state, sessionId);
    if (!session || session.status !== "completed") return { ok: false, message: "המשוב נשלח רק אחרי אימון שבוצע" };
    const existing = state.feedbacks.find((f) => f.sessionId === sessionId);
    if (existing) return { ok: true, feedback: existing, existing: true };
    const send = new Date(session.date + "T12:00:00");
    send.setDate(send.getDate() + 1);
    const feedback = {
      id: "f" + (state.feedbacks.length + 1),
      sessionId,
      clientId: session.clientId,
      sendDate: send.toISOString().slice(0, 10),
      status: "scheduled",
      sentVia: "WhatsApp",
      answers: null,
    };
    state.feedbacks.push(feedback);
    return { ok: true, feedback };
  }
  function submitFeedback(state, feedbackId, answers) {
    const feedback = state.feedbacks.find((f) => f.id === feedbackId);
    if (!feedback) return { ok: false, message: "בקשת המשוב לא נמצאה" };
    const normalized = { workout: Number(answers.workout), difficulty: Number(answers.difficulty), body: Number(answers.body) };

      return { ok: false, message: "כל תשובה חייבת להיות בין 1 ל־5" };
    }
    feedback.answers = normalized;
    feedback.status = "answered";
    const client = getClient(state, feedback.clientId);
    const needsAttention = normalized.body <= 2 || normalized.difficulty === 5 || normalized.workout <= 2;
    if (needsAttention && !state.alerts.some((a) => a.feedbackId === feedbackId)) {
      state.alerts.unshift({
        id: "a" + (state.alerts.length + 1),
        type: "feedback",
        feedbackId,
        text: `${client.name}: משוב האימון דורש בדיקה — אימון ${normalized.workout}/5, קושי ${normalized.difficulty}/5, גוף ${normalized.body}/5`,
        done: false,
      });
    }
    state.activity.unshift({ time: "עכשיו", text: `${client.name}: התקבל משוב יום־אחרי` });
    return { ok: true, feedback, needsAttention };
  }
  function feedbackForClient(state, clientId) {
    return state.feedbacks.filter((f) => f.clientId === clientId);
  }
  function feedbackMessage(state, feedbackId) {
    const feedback = state.feedbacks.find((f) => f.id === feedbackId);
    const client = feedback && getClient(state, feedback.clientId);
    if (!feedback || !client) return "";
    return `היי ${client.name.split(" ")[0]} 💚 איך הגוף אחרי האימון? אשמח שתעני על 3 שאלות קצרות בדירוג 1–5.`;
  }
  function addPayment(state, clientId, amount, method) {
    const client = getClient(state, clientId);
    const value = Number(amount);
    if (!client || !Number.isFinite(value) || value <= 0) return { ok: false, message: "סכום לא תקין" };
    client.paid = Math.min(client.packagePrice, client.paid + value);
    client.paymentMethod = method || client.paymentMethod;
    if (debt(client) === 0) client.receipt = "ממתינה להפקה";
    state.activity.unshift({ time: "עכשיו", text: `${client.name}: התקבל תשלום ${value} ₪ ב${client.paymentMethod}` });
    return { ok: true, client, balance: debt(client) };
  }
  function updatePackagePrice(state, clientId, price) {
    const client = getClient(state, clientId);
    const value = Number(price);
    if (!client || !Number.isFinite(value) || value < 0) return { ok: false, message: "מחיר לא תקין" };
    client.packagePrice = value;
    state.activity.unshift({ time: "עכשיו", text: `${client.name}: המחיר המותאם עודכן ל־${value} ₪` });
    return { ok: true, client };
  }
  function markReceipt(state, clientId) {
    const client = getClient(state, clientId);
    if (!client) return { ok: false };
    client.receipt = "הופקה בדמו";
    state.activity.unshift({ time: "עכשיו", text: `${client.name}: הפקת קבלה סומנה כהדמיה` });
    return { ok: true, client };
  }
  function completeAlert(state, id) {
    const alert = state.alerts.find((a) => a.id === id);
    if (!alert) return false;
    alert.done = true;
    return true;
  }
  function applyVoiceDemo(state) {
    const session = getSession(state, "s4");
    const client = getClient(state, "c2");
    if (session.status !== "confirmed") setSessionStatus(state, "s4", "confirmed");
    if (client.paid < 650) addPayment(state, "c2", 350, "Bit");
    completeAlert(state, "a1");
    completeAlert(state, "a2");
    return {
      ok: true,
      transcript: "דנה אישרה את האימון למחר בשבע ושילמה עכשיו את יתרת 350 השקלים בביט.",
      actions: ["האימון של דנה סומן כמאושר", "נרשם תשלום 350 ₪ ב־Bit", "החוב של דנה נסגר"],
    };
  }
  function answerAgent(state, question) {
    const q = String(question || "");
    if (/חוב|חייב|גבייה/.test(q)) {
      const owing = state.clients.filter((c) => debt(c) > 0);
      return owing.length ? `יתרה כוללת לגבייה: ${owing.reduce((s, c) => s + debt(c), 0)} ₪. ${owing.map((c) => `${c.name} — ${debt(c)} ₪`).join("; ")}.` : "אין כרגע חובות פתוחים.";
    }
    if (/אישור|אישר|שבוע/.test(q)) {
      const waiting = state.sessions.filter((s) => ["planned", "awaiting"].includes(s.status));
      return waiting.length ? `${waiting.length} אימונים עדיין לא מאושרים: ${waiting.map((s) => getClient(state, s.clientId).name).join(", ")}.` : "כל האימונים הקרובים מאושרים.";
    }
    if (/תוכנית|תכניות|תוכניות/.test(q)) {
      return "התוכנית של דנה מסומנת לעדכון כי חלף יותר מחודש. מיה ויעל מעודכנות.";
    }
    if (/רפוא|טופס/.test(q)) {
      return "יעל טרם השלימה את הטופס הרפואי. הטפסים של מיה ודנה הושלמו.";
    }
    return "לא מצאתי תשובה בנתוני הדמו. אפשר לשאול על חובות, אישורי אימונים, תוכניות או טפסים רפואיים.";
  }

  return {
    statuses,
    createState,
    getClient,
    getSession,
    debt,
    chargedSessions,
    remainingSessions,
    totals,
    setSessionStatus,
    scheduleFeedback,
    submitFeedback,
    feedbackForClient,
    feedbackMessage,
    addPayment,
    updatePackagePrice,
    markReceipt,
    completeAlert,
    applyVoiceDemo,
    answerAgent,
  };
});
</script>
  <script>
    (function(){

      const navItems=[['dashboard','סקירה'],['clients','מתאמנים'],['calendar','יומן'],['feedback','משוב יום־אחרי'],['close','סגירת חודש'],['programs','תוכניות']];

      function sideRender(){const open=state.alerts.filter(a=>!a.done);side.innerHTML=`<div class="agent-card"><h3>הסוכן של שחר 🎙</h3><p>מעדכן אימונים ותשלומים מתוך הודעה קולית — תמיד מציג את הפעולות לפני שמירה.</p><button class="primary" id="sideAgent">נסי עדכון קולי</button></div><section class="card section"><div class="sectionhead"><h2>דורש תשומת לב</h2><small>${open.length} פתוחים</small></div>${open.slice(0,4).map(a=>`<div class="alert-item"><div class="alert-icon">${a.type==='payment'?'₪':a.type==='medical'?'✚':a.type==='program'?'↻':a.type==='feedback'?'♥':'◷'}</div><div><p>${esc(a.text)}</p><button class="linkbtn" data-alert="${a.id}">טופל</button></div></div>`).join('')||'<div class="empty">הכול טופל</div>'}</section>`;$('#sideAgent').onclick=agentModal;side.querySelectorAll('[data-alert]').forEach(b=>b.onclick=()=>{C.completeAlert(state,b.dataset.alert);sideRender()})}
      function dashboard(){const t=C.totals(state),today=state.sessions.filter(s=>s.date==='2026-11-02');return pageHead('בוקר טוב, שחר','העסק שלך במבט אחד','יום שני, 2 בנובמבר · השבוע כבר בתנועה','<button class="primary" id="newSession">+ קביעת אימון</button>')+`<div class="grid stats"><div class="card stat"><span>מתאמנים פעילים</span><strong>${t.clients}</strong><small>כולם בטיפול אישי</small></div><div class="card stat"><span>אימונים השבוע</span><strong>${t.weekSessions}</strong><small>${t.awaiting} עדיין דורשים אישור</small></div><div class="card stat"><span>יתרה לגבייה</span><strong>${money(t.debt)}</strong><small>משני מתאמנים</small></div><div class="card stat"><span>התראות פתוחות</span><strong>${t.alerts}</strong><small>הסוכן מרכז עבורך</small></div></div><div class="grid two"><section class="card section"><div class="sectionhead"><h2>האימונים הקרובים</h2><button class="linkbtn" data-go="calendar">ליומן המלא</button></div>${state.sessions.filter(s=>s.date>='2026-11-02').slice(0,5).map(sessionRow).join('')}</section><section class="card section"><div class="sectionhead"><h2>מצב המתאמנים</h2><button class="linkbtn" data-go="clients">לכולם</button></div>${state.clients.map(clientMini).join('')}</section></div><section class="card section" style="margin-top:14px"><div class="sectionhead"><h2>פעילות אחרונה</h2><small>יומן שינויים</small></div>${state.activity.slice(0,5).map(a=>`<div class="alert-item"><div class="alert-icon">✓</div><div><p>${esc(a.text)}</p><small>${a.time}</small></div></div>`).join('')}</section>`}
      function sessionRow(s){const c=C.getClient(state,s.clientId);return `<div class="session"><div class="time">${s.time}</div><div><strong>${esc(c.name)}</strong><small>${s.title} · ${formatDate(s.date)}</small></div>${status(s.status)}</div>`}
      function clientMini(c){const rem=C.remainingSessions(state,c.id),d=C.debt(c);return `<div class="client-mini"><div class="avatar">${c.name[0]}</div><div><strong>${esc(c.name)}</strong><small>${esc(c.packageName)} · ${rem} נותרו</small><div class="progress"><i style="width:${Math.max(8,rem/c.packageSize*100)}%"></i></div></div><div class="money ${d?'debt':''}">${d?money(d):'שולם'}</div></div>`}
      function clients(){return pageHead('לקוחות ומתאמנים','המתאמנים של שחר','כרטיס מלא, מנוי, מידע רפואי ותוכנית במקום אחד','<button class="primary" id="sendIntake">שליחת טופס רפואי</button>')+`<div class="toolbar"><input class="search" id="clientSearch" placeholder="חיפוש לפי שם..."/><select class="filter"><option>כל המתאמנים</option><option>עם חוב פתוח</option><option>טופס רפואי חסר</option></select></div><div class="grid clients-grid" id="clientGrid">${state.clients.map(clientCard).join('')}</div>`}
      function clientCard(c){const rem=C.remainingSessions(state,c.id),d=C.debt(c);return `<article class="card client-card" data-name="${esc(c.name)}"><div class="client-top"><div class="avatar">${c.name[0]}</div><div><h3>${esc(c.name)}</h3><p>${esc(c.goals)}</p></div></div><div class="client-data"><div class="datum"><small>יתרת אימונים</small><strong>${rem} מתוך ${c.packageSize}</strong></div><div class="datum"><small>יתרה לתשלום</small><strong class="${d?'money debt':''}">${d?money(d):'אין חוב'}</strong></div><div class="datum"><small>תוכנית</small><strong>${esc(c.program)}</strong></div><div class="datum"><small>טופס רפואי</small><strong>${esc(c.intakeStatus)}</strong></div></div><div class="client-actions"><button class="soft" data-client="${c.id}">פתיחת כרטיס</button><a class="primary" href="${c.hevyUrl}" target="_blank" style="text-decoration:none;text-align:center">Hevy Coach</a></div></article>`}
      function calendar(){const days=[['ב׳','02.11'],['ג׳','03.11'],['ד׳','04.11'],['ה׳','05.11'],['ו׳','06.11'],['ש׳','07.11'],['א׳','08.11']];return pageHead('תכנון שבועי','יומן האימונים','קבועים, גמישים ואישורי הגעה — עם משמעות ברורה לחיוב','<button class="primary" id="newSession">+ אימון חדש</button>')+`<section class="calendar">${days.map((d,i)=>{const date='2026-11-'+String(2+i).padStart(2,'0'),items=state.sessions.filter(s=>s.date===date);return `<div class="day ${i===0?'today':''}"><div class="dayhead"><strong>${d[0]}</strong><span>${d[1]}</span></div>${items.map(s=>eventCard(s)).join('')||'<div class="empty">פנוי</div>'}</div>`}).join('')}</section><section class="card section" style="margin-top:15px"><div class="sectionhead"><h2>כלל החיוב</h2><small>מופעל אוטומטית בדמו</small></div><div class="note">לפני אישור המועד בעקבות הודעת יום שישי אפשר לבטל ללא חיוב. אחרי שהמועד אושר, ביטול או אי־הגעה מחויבים ומנוכים מהמנוי.</div></section>`}
      function eventCard(s){const c=C.getClient(state,s.clientId),cls=['late_cancel','no_show'].includes(s.status)?'danger-event':s.status==='awaiting'?'warn-event':'';return `<div class="event ${cls}" data-session="${s.id}"><strong>${s.time} · ${esc(c.name)}</strong><small>${C.statuses[s.status].label}</small></div>`}
      function closeMonth(){const t=C.totals(state);return pageHead('נובמבר 2026','סגירת חודש','כמה בוצע, כמה שולם וכמה כל אחד עדיין חייב','<button class="primary" id="closeHelp">הסוכן, מי חייב לי?</button>')+`<div class="grid stats"><div class="card stat"><span>הכנסות שנרשמו</span><strong>${money(t.collected)}</strong><small>מזומן · Bit · העברה</small></div><div class="card stat"><span>יתרה פתוחה</span><strong>${money(t.debt)}</strong><small>ממתינה לגבייה</small></div><div class="card stat"><span>אימונים מחויבים</span><strong>${state.sessions.filter(s=>s.charge).length}</strong><small>כולל ביטול מחויב</small></div><div class="card stat"><span>קבלות לטיפול</span><strong>${state.clients.filter(c=>c.receipt!=='הופקה').length}</strong><small>דרך Paperless</small></div></div><section class="card section"><div class="sectionhead"><h2>פירוט לפי מתאמן</h2><small>נתוני דמו</small></div><div class="tablewrap"><table class="table"><thead><tr><th>מתאמן</th><th>מסלול</th><th>מחיר</th><th>שולם</th><th>יתרה</th><th>אמצעי</th><th>קבלה</th><th></th></tr></thead><tbody>${state.clients.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.packageName)}</td><td>${money(c.packagePrice)}</td><td>${money(c.paid)}</td><td class="money ${C.debt(c)?'debt':''}">${money(C.debt(c))}</td><td>${esc(c.paymentMethod)}</td><td>${esc(c.receipt)}</td><td><button class="linkbtn" data-payment="${c.id}">רישום תשלום</button><button class="linkbtn" data-receipt="${c.id}">קבלה</button></td></tr>`).join('')}</tbody></table></div></section>`}

      function feedbackRow(f){const c=C.getClient(state,f.clientId),a=f.answers;return `<div class="session"><div class="time">${formatDate(f.sendDate)}</div><div><strong>${esc(c.name)}</strong><small>${f.status==='answered'?`אימון ${a.workout}/5 · קושי ${a.difficulty}/5 · גוף ${a.body}/5`:'מתוזמן ליום שאחרי האימון'}</small></div><button class="linkbtn" data-feedback="${f.id}">${f.status==='answered'?'צפייה':'תצוגת הודעה'}</button></div>`}

      function render(){content.innerHTML=view==='dashboard'?dashboard():view==='clients'?clients():view==='calendar'?calendar():view==='feedback'?feedbackView():view==='close'?closeMonth():programs();wire();sideRender()}
      function wire(){content.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setView(b.dataset.go));content.querySelectorAll('[data-client]').forEach(b=>b.onclick=()=>clientModal(b.dataset.client));content.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>sessionModal(b.dataset.session));content.querySelectorAll('[data-payment]').forEach(b=>b.onclick=()=>paymentModal(b.dataset.payment));content.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>{C.markReceipt(state,b.dataset.receipt);render()});content.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>feedbackModal(b.dataset.feedback));const ns=$('#newSession');if(ns)ns.onclick=newSessionModal;const si=$('#sendIntake');if(si)si.onclick=()=>intakeModal('c3');const ch=$('#closeHelp');if(ch)ch.onclick=()=>agentModal('מי חייב לי כסף?');const pf=$('#previewFeedback');if(pf)pf.onclick=()=>feedbackModal('f1');const cs=$('#clientSearch');if(cs)cs.oninput=()=>{const q=cs.value.trim();content.querySelectorAll('[data-name]').forEach(el=>el.style.display=el.dataset.name.includes(q)?'block':'none')}}
      function openModal(html,large=false){modal.className='modal'+(large?' large':'');modal.innerHTML=html;modalBack.classList.add('open');const c=$('[data-close]',modal);if(c)c.onclick=closeModal}
      function closeModal(){modalBack.classList.remove('open')}
      modalBack.onclick=e=>{if(e.target===modalBack)closeModal()};
      function modalHead(title){return `<div class="modal-head"><h2>${title}</h2><button class="close" data-close>✕</button></div>`}
      function clientModal(id){const c=C.getClient(state,id),d=C.debt(c),rem=C.remainingSessions(state,id);openModal(modalHead(c.name)+`<div class="modal-body"><div class="client-top"><div class="avatar">${c.name[0]}</div><div><h3 style="margin:0">${esc(c.name)}</h3><p style="color:var(--muted)">${esc(c.phone)} · ${c.frequency} אימונים בשבוע</p></div></div><div class="tabs"><button class="active">כללי</button><button>אימונים</button><button>תשלומים</button><button>מידע רפואי</button></div><div class="detail-grid"><div class="detail-box"><small>מנוי</small><strong>${esc(c.packageName)}</strong></div><div class="detail-box"><small>יתרה</small><strong>${rem} מתוך ${c.packageSize} אימונים</strong></div><div class="detail-box"><small>מחיר שנקבע</small><strong>${money(c.packagePrice)}</strong></div><div class="detail-box"><small>חוב פתוח</small><strong>${money(d)}</strong></div><div class="detail-box"><small>תוכנית</small><strong>${esc(c.program)}</strong></div><div class="detail-box"><small>טופס רפואי</small><strong>${esc(c.intakeStatus)}</strong></div></div><h3>מטרות</h3><p>${esc(c.goals)}</p><h3>מידע רפואי</h3><div class="note">${esc(c.medical)}</div><div class="modal-actions"><a class="primary" href="${c.hevyUrl}" target="_blank" style="text-decoration:none">פתיחה ב־Hevy Coach</a><button class="soft" id="editPrice">מחיר מותאם</button><button class="soft" id="openIntake">טופס רפואי</button></div></div>`);$('#editPrice').onclick=()=>priceModal(id);$('#openIntake').onclick=()=>intakeModal(id)}
      function priceModal(id){const c=C.getClient(state,id);openModal(modalHead('מחיר מותאם — '+c.name)+`<div class="modal-body"><div class="field"><label>מחיר החבילה</label><input id="customPrice" type="number" value="${c.packagePrice}"></div><div class="note" style="margin-top:12px">המחיר נשמר לעסקה הזו בלבד. שינוי במחירון לא ישנה עסקאות קודמות.</div><div class="modal-actions"><button class="primary" id="savePrice">שמירה</button></div></div>`);$('#savePrice').onclick=()=>{C.updatePackagePrice(state,id,$('#customPrice').value);closeModal();render()}}
      function paymentModal(id){const c=C.getClient(state,id);openModal(modalHead('רישום תשלום — '+c.name)+`<div class="modal-body"><div class="detail-box" style="margin-bottom:14px"><small>יתרה פתוחה</small><strong>${money(C.debt(c))}</strong></div><div class="form-grid"><div class="field"><label>סכום</label><input id="payAmount" type="number" value="${C.debt(c)}"></div><div class="field"><label>אמצעי תשלום</label><select id="payMethod"><option>Bit</option><option>מזומן</option><option>העברה בנקאית</option></select></div></div><div class="modal-actions"><button class="primary" id="savePayment">שמירת תשלום</button></div></div>`);$('#savePayment').onclick=()=>{C.addPayment(state,id,$('#payAmount').value,$('#payMethod').value);closeModal();render()}}
      function sessionModal(id){const s=C.getSession(state,id),c=C.getClient(state,s.clientId);openModal(modalHead('אימון — '+c.name)+`<div class="modal-body"><div class="detail-grid"><div class="detail-box"><small>מועד</small><strong>${formatDate(s.date)} · ${s.time}</strong></div><div class="detail-box"><small>סטטוס נוכחי</small><strong>${C.statuses[s.status].label}</strong></div></div><h3>עדכון סטטוס</h3><div class="quickq">${Object.entries(C.statuses).map(([k,v])=>`<button data-new-status="${k}">${v.label}</button>`).join('')}</div><div class="note" style="margin-top:16px">סטטוס „בוצע”, „ביטול מחויב” או „לא הגיע” ינכה אימון מהמנוי.</div></div>`);modal.querySelectorAll('[data-new-status]').forEach(b=>b.onclick=()=>{C.setSessionStatus(state,id,b.dataset.newStatus);closeModal();render()})}
      function newSessionModal(){openModal(modalHead('קביעת אימון חדש')+`<div class="modal-body"><div class="form-grid"><div class="field"><label>מתאמנת</label><select id="newClient">${state.clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><div class="field"><label>תאריך</label><input type="date" value="2026-11-08"></div><div class="field"><label>שעה</label><input type="time" value="18:00"></div><div class="field"><label>סטטוס</label><select><option>ממתין לאישור</option><option>מאושר</option></select></div></div><div class="modal-actions"><button class="primary" id="demoSaveSession">שמירת אימון</button></div></div>`);$('#demoSaveSession').onclick=()=>{alert('בדמו המלא האימון יתווסף ליומן.');closeModal()}}
      function intakeModal(id){const c=C.getClient(state,id);openModal(modalHead('טופס קליטה רפואי — '+c.name)+`<div class="modal-body"><div class="note">קישור אישי לדוגמה: shahar-fit.example/intake/${c.id.toUpperCase()} · בדמו אין שליחה או שמירת מידע אמיתי.</div><div class="form-grid" style="margin-top:16px"><div class="field"><label>שם מלא</label><input value="${esc(c.name)}"></div><div class="field"><label>תאריך לידה</label><input type="date" value="${c.birthDate}"></div><div class="field full"><label>מצב רפואי, פציעות או מגבלות</label><textarea rows="3">${esc(c.medical)}</textarea></div><div class="field full"><label>מטרות האימון</label><textarea rows="2">${esc(c.goals)}</textarea></div></div><div class="modal-actions"><button class="primary" id="copyIntake">העתקת קישור</button><button class="soft" data-close>סגירה</button></div></div>`,true);$('#copyIntake').onclick=()=>alert('הקישור הועתק — הדמיה בלבד')}
      function feedbackModal(id){const f=state.feedbacks.find(x=>x.id===id),c=f&&C.getClient(state,f.clientId);if(!f||!c)return;const a=f.answers;openModal(modalHead('משוב יום־אחרי — '+c.name)+`<div class="modal-body"><div class="note"><strong>הודעה אוטומטית:</strong><br>${esc(C.feedbackMessage(state,id))}<br><small>בדמו ההודעה והשליחה הן הדמיה בלבד.</small></div>${a?`<div class="detail-grid" style="margin-top:16px"><div class="detail-box"><small>איך היה האימון?</small><strong>${a.workout}/5</strong></div><div class="detail-box"><small>רמת הקושי</small><strong>${a.difficulty}/5</strong></div><div class="detail-box"><small>איך הגוף מרגיש היום?</small><strong>${a.body}/5</strong></div></div>`:`<div class="form-grid" style="margin-top:18px"><div class="field full"><label>1. איך היה האימון? · 1 לא טוב, 5 מצוין</label><select id="fbWorkout"><option value="1">1 — לא טוב</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5" selected>5 — מצוין</option></select></div><div class="field full"><label>2. רמת הקושי שהרגשת · 1 קל מאוד, 5 קשה מאוד</label><select id="fbDifficulty"><option value="1">1 — קל מאוד</option><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option><option value="5">5 — קשה מאוד</option></select></div><div class="field full"><label>3. איך הגוף מרגיש היום? · 1 לא טוב, 5 מצוין</label><select id="fbBody"><option value="1">1 — לא טוב</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option><option value="5">5 — מצוין</option></select></div></div><div class="modal-actions"><button class="primary" id="submitFeedback">שליחת המשוב</button></div>`}</div>`,true);const submit=$('#submitFeedback');if(submit)submit.onclick=()=>{const r=C.submitFeedback(state,id,{workout:$('#fbWorkout').value,difficulty:$('#fbDifficulty').value,body:$('#fbBody').value});if(r.ok){alert(r.needsAttention?'המשוב נשמר ושחר קיבלה התראה לבדיקה':'המשוב נשמר — תודה!');closeModal();render()}}}
      function agentModal(autoQuestion){openModal(modalHead('הסוכן של שחר')+`<div class="modal-body"><div class="chat" id="chat"><div class="bubble bot">היי שחר, אפשר להקליט לי שינוי ביומן, תשלום או שאלה על העסק.</div></div><div class="voice"><button id="voiceDemo">🎙</button><div><strong>לחצי להפעלת הקלטת דמו</strong><br><span>הדמו ישמיע תרחיש מוכן ויציג את הפעולות לפני שמירה</span></div></div><div class="quickq"><button data-q="מי חייב לי כסף?">מי חייב לי כסף?</button><button data-q="מי עדיין לא אישר השבוע?">מי לא אישר?</button><button data-q="איזו תוכנית צריך לעדכן?">תוכניות לעדכון</button><button data-q="מי לא מילאה טופס רפואי?">טפסים רפואיים</button></div></div>`);const chat=$('#chat');function ask(q){chat.insertAdjacentHTML('beforeend',`<div class="bubble user">${esc(q)}</div><div class="bubble bot">${esc(C.answerAgent(state,q))}</div>`);chat.scrollTop=chat.scrollHeight}modal.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));$('#voiceDemo').onclick=()=>{const preview='דנה אישרה את האימון למחר בשבע ושילמה עכשיו את יתרת 350 השקלים בביט.';chat.insertAdjacentHTML('beforeend',`<div class="bubble user">🎙 ${preview}</div><div class="bubble bot"><strong>זיהיתי 3 פעולות:</strong><br>1. אישור האימון של דנה<br>2. רישום תשלום 350 ₪ ב־Bit<br>3. סגירת החוב<br><button class="primary" id="confirmVoice" style="margin-top:9px">אישור ועדכון</button></div>`);$('#confirmVoice').onclick=()=>{const r=C.applyVoiceDemo(state);chat.insertAdjacentHTML('beforeend',`<div class="bubble bot">עודכן ✓<br>${r.actions.map(esc).join('<br>')}</div>`);renderNav();sideRender()}};if(autoQuestion)setTimeout(()=>ask(autoQuestion),0)}
      function formatDate(d){return new Date(d+'T12:00:00').toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'})}
      $('#openAgent').onclick=agentModal;renderNav();render();
      window.__SHAHAR_DEMO__={state,setView,render,clientModal,sessionModal,paymentModal,intakeModal,feedbackModal,agentModal,newSessionModal};
    })();
  </script>
</body>
</html>
